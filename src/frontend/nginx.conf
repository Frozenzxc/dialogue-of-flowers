server {
    listen 80;
    server_name xn--80aeacdjrz1ad7b6b.xn--p1ai www.xn--80aeacdjrz1ad7b6b.xn--p1ai _;

    client_max_body_size 100m;

    gzip on;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # docker-DNS для переживания пересозданий контейнеров upstream-ами
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ACME-проверка certbot (том ./deploy/certbot/www)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Strapi: админка /cms/admin, API /cms/api, медиа /cms/uploads.
    # ^~ обязателен: без него regex-локации ниже перехватят /cms/uploads/*.webp
    location = /cms {
        return 301 /cms/;
    }

    location ^~ /cms/ {
        set $strapi_upstream strapi:1337;
        rewrite ^/cms/(.*)$ /$1 break;
        proxy_pass http://$strapi_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # загрузка изображений через админку
        proxy_read_timeout 300s;
    }

    # сборочные чанки Nuxt с хэшем в имени — кэшируем навсегда
    location ^~ /_nuxt/ {
        set $frontend_upstream frontend:3000;
        proxy_pass http://$frontend_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # картинки и шрифты
    location ~* \.(webp|png|jpg|jpeg|svg|gif|ico|woff|woff2|ttf)$ {
        set $frontend_upstream frontend:3000;
        proxy_pass http://$frontend_upstream;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # всё остальное — SSR HTML с полным контентом страниц
    location / {
        set $frontend_upstream frontend:3000;
        proxy_pass http://$frontend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
