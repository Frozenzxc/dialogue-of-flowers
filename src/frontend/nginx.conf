server {
    listen 80;
    server_name xn--80aeacdjrz1ad7b6b.xn--p1ai www.xn--80aeacdjrz1ad7b6b.xn--p1ai _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ACME-проверка certbot (том ./deploy/certbot/www)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # сборочные чанки Nuxt с хэшем в имени — кэшируем навсегда
    location ^~ /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # прочая статика: картинки и шрифты
    location ~* \.(webp|png|jpg|jpeg|svg|gif|ico|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Strapi: админка /cms/admin, API /cms/api, медиа /cms/uploads.
    # ^~ обязателен: без него regex локаций выше перехватят /cms/uploads/*.webp.
    # resolver+переменная — чтобы nginx переживал пересоздание контейнера strapi
    location = /cms {
        return 301 /cms/;
    }

    location ^~ /cms/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $strapi_upstream strapi:1337;
        rewrite ^/cms/(.*)$ /$1 break;
        proxy_pass http://$strapi_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # загрузка изображений через админку
        client_max_body_size 100m;
        proxy_read_timeout 300s;
    }

    # SPA-фолбэк
    location / {
        try_files $uri $uri/ /index.html;
    }
}
